site_name: LightGuard-Agent
site_description: Sub-millisecond defense against Indirect Prompt Injection in AI agents and MCP workflows.
site_author: Tarek Mohamed
site_url: https://seotarek.github.io/LightGuard-Agent/
repo_url: https://github.com/seotarek/LightGuard-Agent
repo_name: seotarek/LightGuard-Agent

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Security Defenses: defenses.md
  - RAG Context Shield: rag.md
  - DLP & Privacy Redaction: privacy.md
  - Multi-Agent Swarm Shield: swarm.md
  - MCP Security Gateway: mcp_gateway.md
  - Multimodal & Metadata Shield: multimodal.md
  - Structured Output Guard: structured.md
  - Executive Compliance Report: reporting.md
  - Security Policies: policy.md
  - Telemetry & Observability: telemetry.md
  - Universal Wrapper & Middleware: wrapper.md
  - Model Context Protocol: mcp.md
  - Framework Integrations: integrations.md
  - Red-Team & Auditing: redteam.md
  - Benchmarks: benchmarks.md
  - Research & Citation: research.md
