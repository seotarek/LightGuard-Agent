name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: Mandatory Quality & Security Gates
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-cov
        pip install -e .

    - name: Verify zero lint violations
      run: |
        ruff check lightguard tests

    - name: Verify test suite and coverage threshold
      run: |
        pytest -v --cov=lightguard --cov-fail-under=80 --cov-report=term-missing tests/

  build-and-publish:
    name: Build & Publish to PyPI (with Provenance Attestation)
    needs: test-and-lint
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package distributions
      run: |
        python -m build

    - name: Check package distributions
      run: |
        twine check dist/*

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        attestations: true
